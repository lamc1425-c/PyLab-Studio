<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./src/styles.css"><style>html,body{margin:0;width:100%;height:100%}.workspace{width:800px;height:600px}.editor-panel{background:#223}.terminal-panel{background:#112}.workspace-resizer{background:rgba(255,0,0,.08)}</style></head><body><main class="workspace" id="w"><section class="editor-panel" id="e"></section><div class="workspace-resizer" id="r"><span></span></div><section class="terminal-panel" id="t"><header class="terminal-header">Terminal</header><pre class="terminal-output"></pre><form class="terminal-input-row"></form></section></main><output id="o"></output><script>setTimeout(()=>{const b=id=>{const r=document.getElementById(id).getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};document.getElementById('o').textContent=JSON.stringify({w:b('w'),e:b('e'),r:b('r'),t:b('t')});},100);</script></body></html>
